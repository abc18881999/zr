<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>牛牛 - 棋牌游戏</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050508; color: #ffd700; font-family: sans-serif; }
        .game-container { width: 100%; max-width: 450px; margin: 0 auto; background: linear-gradient(180deg, rgba(20,15,5,0.85) 0%, rgba(5,5,8,0.98) 100%); border-left: 2px solid #b89742; border-right: 2px solid #b89742; min-height: 100vh; padding: 20px; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; background: rgba(10,8,5,0.8); border: 1px solid #ffd700; border-radius: 8px; }
        .back-btn { background: none; border: none; color: #ffd700; font-size: 18px; cursor: pointer; }
        .game-title { font-size: 16px; font-weight: bold; text-shadow: 0 0 10px #ffd700; }
        .balance { font-size: 14px; color: #fff; }
        .game-area { background: rgba(10,8,5,0.6); border: 2px solid #ffd700; border-radius: 12px; padding: 20px; margin: 15px 0; }
        .table-area { background: rgba(139, 101, 8, 0.3); border: 2px solid #b8860b; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .player-info { display: flex; justify-content: space-around; margin-bottom: 15px; }
        .player { text-align: center; }
        .player-status { font-size: 12px; color: #888; }
        .player-cards { font-size: 28px; margin: 5px 0; }
        .player-result { font-size: 12px; color: #00ff00; margin-top: 5px; }
        .action-buttons { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 10px; background: linear-gradient(180deg, #ffd700, #b8860b); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .action-btn:hover { transform: scale(1.05); }
        .result { text-align: center; padding: 10px; background: rgba(10,8,5,0.8); border: 1px solid #ffd700; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <button class="back-btn" onclick="history.back()">← 返回</button>
            <div class="game-title">🐄 牛牛</div>
            <div class="balance" id="balance">余额: 10000</div>
        </div>

        <div class="game-area">
            <div class="table-area">
                <div class="player-info">
                    <div class="player">
                        <div class="player-status">🎮 你</div>
                        <div class="player-cards" id="playerCards">🂠 🂠 🂠 🂠 🂠</div>
                        <div class="player-result" id="playerResult">-</div>
                    </div>
                </div>
                <div class="player-info">
                    <div class="player">
                        <div class="player-status">对手</div>
                        <div class="player-cards">🂡 🂢 🂣 🂤 🂥</div>
                        <div class="player-result">-</div>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn" onclick="playGame('passive')">被动</button>
                <button class="action-btn" onclick="playGame('normal')">普通</button>
                <button class="action-btn" onclick="playGame('aggressive')">主动</button>
            </div>

            <div class="result" id="result" style="margin-top: 10px;">游戏准备就绪</div>
        </div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('wd_wallet')) || 10000;
        const betAmount = 100;

        function updateBalance() {
            document.getElementById('balance').textContent = `余额: ${balance}`;
            localStorage.setItem('wd_wallet', balance);
        }

        function playGame(strategy) {
            if (balance < betAmount) {
                document.getElementById('result').textContent = '余额不足！';
                return;
            }

            balance -= betAmount;
            updateBalance();

            const playerCards = [];
            for (let i = 0; i < 5; i++) {
                playerCards.push(Math.floor(Math.random() * 9) + 1);
            }

            document.getElementById('playerCards').textContent = playerCards.map(c => `${c}🂠`).join(' ');

            setTimeout(() => {
                const playerSum = playerCards.reduce((a, b) => a + b) % 10;
                const opponentSum = Math.floor(Math.random() * 10);

                document.getElementById('playerResult').textContent = `总点: ${playerSum}`;
                document.getElementById('result').textContent = `你的策略: ${strategy}`;

                let winnings = 0;
                if (playerSum > opponentSum) {
                    winnings = betAmount * 2;
                    document.getElementById('result').textContent = `🎉 你赢了！获得 ${winnings} 金币！`;
                } else if (playerSum < opponentSum) {
                    document.getElementById('result').textContent = `对手赢了，继续加油！`;
                } else {
                    document.getElementById('result').textContent = `平局！返还 ${betAmount} 金币`;
                    winnings = betAmount;
                }

                balance += winnings;
                updateBalance();
            }, 1000);
        }

        updateBalance();
    </script>
</body>
</html>
