<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>德州扑克 - 棋牌游戏</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050508; color: #ffd700; font-family: sans-serif; }
        .game-container { width: 100%; max-width: 450px; margin: 0 auto; background: linear-gradient(180deg, rgba(20,15,5,0.85) 0%, rgba(5,5,8,0.98) 100%); border-left: 2px solid #b89742; border-right: 2px solid #b89742; min-height: 100vh; padding: 20px; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; background: rgba(10,8,5,0.8); border: 1px solid #ffd700; border-radius: 8px; }
        .back-btn { background: none; border: none; color: #ffd700; font-size: 18px; cursor: pointer; }
        .game-title { font-size: 16px; font-weight: bold; text-shadow: 0 0 10px #ffd700; }
        .balance { font-size: 14px; color: #fff; }
        .game-area { background: rgba(10,8,5,0.6); border: 2px solid #ffd700; border-radius: 12px; padding: 20px; margin: 15px 0; }
        .table-area { background: rgba(0, 80, 0, 0.3); border: 2px solid #00aa00; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .player-info { display: flex; justify-content: space-around; margin-bottom: 15px; }
        .player { text-align: center; }
        .player-status { font-size: 12px; color: #888; }
        .player-cards { font-size: 30px; margin: 5px 0; }
        .action-buttons { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 10px; background: linear-gradient(180deg, #ffd700, #b8860b); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .action-btn:hover { transform: scale(1.05); }
        .action-btn:disabled { opacity: 0.5; }
        .result { text-align: center; padding: 10px; background: rgba(10,8,5,0.8); border: 1px solid #ffd700; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <button class="back-btn" onclick="window.location.href='/index.html'">← 返回</button>
            <div class="game-title">♠️ 德州扑克</div>
            <div class="balance" id="balance">余额: 10000</div>
        </div>

        <div class="game-area">
            <div class="table-area">
                <div class="player-info">
                    <div class="player">
                        <div class="player-status">🎮 你</div>
                        <div class="player-cards" id="playerCards">🂠 🂠</div>
                    </div>
                    <div class="player">
                        <div class="player-status">对手</div>
                        <div class="player-cards">🂡 🂢</div>
                    </div>
                </div>

                <div style="text-align: center; font-size: 12px; color: #888; margin: 10px 0;">
                    公共牌: <span id="communityCards" style="font-size: 24px;">-</span>
                </div>
            </div>

            <div class="action-buttons" id="actionButtons">
                <button class="action-btn" onclick="playerAction('fold')">弃牌</button>
                <button class="action-btn" onclick="playerAction('check')">过牌</button>
                <button class="action-btn" onclick="playerAction('call')">跟注</button>
                <button class="action-btn" onclick="playerAction('raise')">加注</button>
            </div>

            <div class="result" id="result" style="margin-top: 10px;">游戏准备就绪</div>
        </div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('wd_wallet')) || 10000;
        let gameActive = false;
        const betAmount = 100;

        function updateBalance() {
            document.getElementById('balance').textContent = `余额: ${balance}`;
            localStorage.setItem('wd_wallet', balance);
        }

        function playerAction(action) {
            if (gameActive) {
                document.getElementById('result').textContent = `玩家选择: ${action}`;
                
                let winnings = 0;
                if (action === 'raise') {
                    winnings = betAmount * 3;
                } else if (action === 'call') {
                    winnings = betAmount * 2;
                } else if (action === 'check') {
                    winnings = betAmount;
                } else {
                    winnings = 0;
                }

                if (Math.random() > 0.5) {
                    balance += winnings;
                    document.getElementById('result').textContent = `🎉 你赢了！获得 ${winnings} 金币！`;
                } else {
                    document.getElementById('result').textContent = `对手赢了，继续加油！`;
                }

                updateBalance();
                gameActive = false;
                
                setTimeout(() => {
                    startGame();
                }, 2000);
            }
        }

        function startGame() {
            if (balance < betAmount) {
                document.getElementById('result').textContent = '余额不足！';
                return;
            }

            gameActive = true;
            balance -= betAmount;
            updateBalance();

            document.getElementById('playerCards').textContent = `🂡 🂢`;
            document.getElementById('communityCards').textContent = `🂠 🂠 🂠`;
            document.getElementById('result').textContent = '选择你的行动...';
        }

        startGame();
    </script>
</body>
</html>
